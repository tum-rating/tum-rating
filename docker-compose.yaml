version: "3.9"
services:
  mongodb:
    build:
      context: .
      dockerfile: development/mongo.Dockerfile
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root-user
      MONGO_INITDB_ROOT_PASSWORD: root-password
    ports:
      - 27017:27017
    command: --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all --port 27017
    healthcheck:
      test: |
        echo "
          try { 
            rs.status()
          } catch (err) { 
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017', priority:2}]}) 
        }" | mongosh --port 27017 -u root-user -p root-password --authenticationDatabase admin
      interval: 5s
      timeout: 15s
      start_period: 15s
      retries: 10

  mailer:
    image: maildev/maildev
    ports:
      - "1025:1025"
      - "1080:1080"

  oidc:
    build:
      context: .
      dockerfile: development/oidc/Dockerfile
    ports:
      - "1939:1939"
