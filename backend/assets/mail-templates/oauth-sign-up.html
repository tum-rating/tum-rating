<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUM ID Signup</title>
    <style>
        [Styles]
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <a href="https://tum-rating.de/" target="_blank">
            <img src="[LogoUrl]" alt="TUM-RATING" title="TUM-RATING"/>
        </a>
    </div>

    <div class="content">
        <p>Hello <b>[Email]</b>,</p>
        <p>You have successfuly registered with TUM ID.</p>
        <p>If it wasn't you, contact support immediately.</p>

        <p>🐛 regards,</p>
        <p><strong>TUM-RATING</strong></p>
    </div>

    <div class="footer">
        <a href="[BaseUrl]">www.tum-rating.de</a>
        <div class="social">
            <a href="[TelegramLink]" target="_blank">
                <img src="https://img.icons8.com/?size=100&id=63306&format=png&color=000000" alt="Telegram"
                     title="Telegram"/>
            </a>
        </div>
    </div>
</div>
</body>
</html>
