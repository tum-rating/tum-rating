name: Staging Open PR from Develop
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Version bump (major minor patch)"
        options:
          - "major"
          - "minor"
          - "patch"
        default: "patch"
jobs:
  staging-open-pr-from-develop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.18

      - name: Bump version
        id: version-bump
        run: |
          echo "Bumping version type ${{ github.event.inputs.version_bump }}"
          npm --no-commit-hooks --no-git-tag-version version ${{ github.event.inputs.version_bump }}
          PACKAGE_VERSION=$(cat ./package.json | jq '.version' | tr -d '"')
          echo "Package version after bump: ${PACKAGE_VERSION}"
          echo "current-version=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT

      - name: Commit new version
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add .
          git commit -m "Bump version ${{ steps.version-bump.outputs.current-version }}"
          git push origin develop

      - name: Create develop branch
        run: |
          git checkout -b staging/develop-pr-${{ steps.version-bump.outputs.current-version }}
          git push origin staging/develop-pr-${{ steps.version-bump.outputs.current-version }}

      - name: Open PR to staging
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: Update report
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
          branch: staging/develop-pr-${{ steps.version-bump.outputs.current-version }}
          base: staging
          delete-branch: true
          title: '[Example] Update report'
          body: |
            Staging PR from develop, release step.
