name: CI

on:
  pull_request:
    branches:
      - master

jobs:  
  build-pr-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker compose
        id: docker-compose
        run: |
          echo ---Starting docker compose---
          docker-compose -f docker-compose-ci.yml up --build -d
          echo ---Containers up---
