name: Build 

on:
  pull_request:
    branches:
      - master

jobs:  
  build-pr-master:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        id: build-image
        run: |
          # Build a docker container and
          docker build -f ./backend/Dockerfile -t tum-rating/build .
