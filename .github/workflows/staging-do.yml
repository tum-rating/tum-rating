name: Deploy to DigitalOcean

on:
  push:
    branches:
      - staging


jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login, build, tag, and push image to DigitalOcean
        id: build-image
        env:
            DO_REPOSITORY: ${{ vars.DO_REPOSITORY }} 
            IMAGE_TAG: ${{ github.ref_name }}
        run: |
          # Login
          docker login $DO_REPOSITORY --username ${{ secrets.DIGITAL_OCEAN_TOKEN }} --password ${{ secrets.DIGITAL_OCEAN_TOKEN }}
          # Build a docker container and
          docker build -f ./backend/Dockerfile -t $DO_REPOSITORY:$IMAGE_TAG .
          docker push $DO_REPOSITORY:$IMAGE_TAG
          echo "image=$DO_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT


