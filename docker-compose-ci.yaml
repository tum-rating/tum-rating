version: "3.9"
services:
  mongodb:
    image: mongo:7.0.0-rc10
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root-user
      MONGO_INITDB_ROOT_PASSWORD: root-password
  mailer:
    image: maildev/maildev
    ports:
      - "1025:1025"
      - "1080:1080"
  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    
    ports:
      - "3000:3000"
    environment:
    #APP
      APP_PORT: 3000
      NODE_ENV: production

      #MONGO
      MONGO_URI: mongodb://root-user:root-password@mongodb:27017
      MONGO_DB: tum-rating

      #JWT
      JWT_SECRET: jwt-secret 
      JWT_EXPIRATION: 

      #MAILER
      MAILER_HOST: mailer
      MAILER_PORT: 1025
      MAILER_SENDER: TUM REVIEW<tumreview@gmail.com>
      MAILER_ADMIN_EMAILS: admin@email.com

      #SIGNUP
      ACCEPTED_EMAILS_DOMAINS: mytum.de,tum.de

      #WEBAPP
      WEBAPP_PROTOCOL: http
      WEBAPP_HOST: localhost
      WEBAPP_PORT: 5174
    depends_on:
      - mongodb
      - mailer

