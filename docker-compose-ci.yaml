version: "3.9"
include: 
  - ./docker-compose.yaml
services:
  server:
    build:
      context: .
      dockerfile: backend/Dockerfile
    
    ports:
      - "3000:3000"
    environment:
    #APP
      APP_PORT: 3000
      NODE_ENV: production

      #MONGO
      MONGO_URI: mongodb://root-user:root-password@mongodb:27017
      MONGO_DB: tum-rating

      #JWT
      JWT_SECRET: jwt-secret 
      JWT_EXPIRATION: 

      #MAILER
      MAILER_HOST: mailer
      MAILER_PORT: 1025
      MAILER_USER: user
      MAILER_PASS: pass
      MAILER_SENDER: TUM RATING<tumreview@gmail.com>
      MAILER_ADMIN_EMAILS: admin@email.com

      #SIGNUP
      ACCEPTED_EMAILS_DOMAINS: mytum.de,tum.de

      #WEBAPP
      WEBAPP_PROTOCOL: http
      WEBAPP_HOST: localhost
      WEBAPP_PORT: 5174
    depends_on:
      - mongodb
      - mailer

